<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

                        const labelB = document.createElement('label');
                        const inputB = document.createElement('input');
                        inputB.type = 'radio';
                        inputB.name = `q${qIndex}`;
                        inputB.value = q.valB;
                        labelB.appendChild(inputB);
                        labelB.appendChild(document.createTextNode(`B. 不像我`));
                        qDiv.appendChild(labelB);
                        
                        div.appendChild(qDiv);
                        qIndex++;
                    });
                    
                    form.appendChild(div);
                });
                
                const nextBtn = document.createElement('button');
                nextBtn.textContent = '下一頁';
                nextBtn.id = 'nextBtn';
                form.appendChild(nextBtn);
                
                nextBtn.addEventListener('click', handleNext);
            } catch (error) {
                console.error('Error generating form:', error);
                toast.textContent = '表單生成失敗，請重試！';
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            }
        }
        
        let currentDim = 0;
        const totalDims = 4;
        
        function updateProgress() {
            try {
                progress.style.width = `${(currentDim / totalDims) * 100}%`;
            } catch (error) {
                console.error('Error updating progress:', error);
            }
        }
        
        function handleNext(e) {
            e.preventDefault();
            try {
                const dims = document.querySelectorAll('.dimension');
                const current = dims[currentDim];
                
                const radios = current.querySelectorAll('input[type="radio"]:checked');
                if (radios.length < 3) {
                    toast.style.display = 'block';
                    setTimeout(() => toast.style.display = 'none', 3000);
                    return;
                }
                
                if (currentDim < totalDims - 1) {
                    current.classList.remove('active');
                    currentDim++;
                    dims[currentDim].classList.add('active');
                    updateProgress();
                    if (currentDim === totalDims - 1) {
                        document.getElementById('nextBtn').textContent = '提交並探索香氣';
                    }
                } else {
                    calculateResult();
                }
            } catch (error) {
                console.error('Error handling next:', error);
                toast.textContent = '操作失敗，請重試！';
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            }
        }
        
        function calculateResult() {
            try {
                let ei = 0, sn = 0, tf = 0, jp = 0;
                
                for (let i = 1; i <= 12; i++) {
                    const val = document.querySelector(`input[name="q${i}"]:checked`)?.value;
                    if (val) {
                        if (i <= 3) {
                            if (val === 'E') ei++; else ei--;
                        } else if (i <= 6) {
                            if (val === 'S') sn++; else sn--;
                        } else if (i <= 9) {
                            if (val === 'T') tf++; else tf--;
                        } else {
                            if (val === 'J') jp++; else jp--;
                        }
                    }
                }
                
                const type1 = (ei >= 0) ? 'E' : 'I';
                const type2 = (sn >= 0) ? 'S' : 'N';
                const type3 = (tf >= 0) ? 'T' : 'F';
                const type4 = (jp >= 0) ? 'J' : 'P';
                const mbti = type1 + type2 + type3 + type4;
                
                let group = '';
                for (const g in groups) {
                    if (groups[g].types.includes(mbti)) {
                        group = g;
                        break;
                    }
                }
                
                mbtiTypeSpan.textContent = mbti;
                groupDescription.textContent = group ? groups[group].desc : '您的類型屬於特殊組合，適合平衡情緒的通用香調。';
                
                const groupData = groups[group] || {
                    tunes: [{ name: '通用調', desc: '平衡情緒，適合多數場合。', recipes: ['前調 - 甜橙（3滴）；中調 - 薰衣草（2滴）；後調 - 雪松（1滴）。'] }]
                };
                const selectedTune = groupData.tunes[Math.floor(Math.random() * groupData.tunes.length)];
                const selectedRecipe = selectedTune.recipes[Math.floor(Math.random() * selectedTune.recipes.length)];
                
                typeDescription.textContent = `您的類型適合 ${selectedTune.name}，${selectedTune.desc}`;
                scentRecommendation.innerHTML = `
                    <img src="${imageMap[selectedTune.name] || imageMap['通用調'] || ''}" alt="${selectedTune.name} 精油植物水彩圖" class="scent-image">
                    <div class="scent-info">
                        <img src="${iconMap[selectedTune.name] || iconMap['通用調'] || ''}" alt="${selectedTune.name} 圖標">
                        <div>
                            <strong>${selectedTune.name}</strong><br>
                            ${selectedTune.desc}
                        </div>
                    </div>
                    <div class="recipe"><strong>推薦配方：</strong> ${selectedRecipe} (比例 3:2:1，可依喜好調整)</div>
                `;
                
                form.style.display = 'none';
                resultDiv.style.display = 'block';
            } catch (error) {
                console.error('Error calculating result:', error);
                toast.textContent = '結果計算失敗，請重試！';
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            }
        }
        
        // 初始化
        try {
            generateForm();
            updateProgress();
        } catch (error) {
            console.error('Initialization error:', error);
            toast.textContent = '初始化失敗，請重新載入頁面！';
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
